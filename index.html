<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a0f">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --cyan:#00e5ff; --gold:#ffb300; --bg:#050a0f; --panel:rgba(0,229,255,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(0,229,255,.10), transparent 60%),
      radial-gradient(900px 500px at 80% 110%, rgba(255,179,0,.07), transparent 60%),
      var(--bg);
    color:#c9f7ff; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* subtle scanlines */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
    background:repeating-linear-gradient(0deg, transparent 0 2px, #00e5ff 2px 3px);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid rgba(0,229,255,.15);
  }
  header h1{font-size:15px; letter-spacing:.35em; color:var(--cyan); font-weight:600; text-shadow:0 0 12px rgba(0,229,255,.6)}
  #status{font-size:11px; letter-spacing:.2em; padding:4px 12px; border:1px solid rgba(0,229,255,.35); border-radius:20px; color:#7fdcff}
  #status.active{color:var(--gold); border-color:rgba(255,179,0,.5); box-shadow:0 0 12px rgba(255,179,0,.2)}
  #status.speaking{color:#aaffaa; border-color:rgba(170,255,170,.5)}

  main{flex:1; display:flex; flex-direction:column; min-height:0}

  /* ---- ORB ---- */
  .orb-zone{position:relative; height:38vh; min-height:220px; display:flex; align-items:center; justify-content:center; flex:none}
  .ring{position:absolute; border-radius:50%; border:1px solid rgba(0,229,255,.35)}
  .r1{width:180px;height:180px; animation:spin 14s linear infinite; border-style:dashed}
  .r2{width:230px;height:230px; animation:spin 22s linear infinite reverse; border-color:rgba(0,229,255,.18)}
  .r3{width:280px;height:280px; animation:spin 30s linear infinite; border-color:rgba(255,179,0,.22); border-style:dotted}
  @keyframes spin{to{transform:rotate(360deg)}}
  .core{
    width:110px; height:110px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #d8feff, var(--cyan) 45%, #007e8f 80%);
    box-shadow:0 0 40px rgba(0,229,255,.55), inset 0 0 24px rgba(255,255,255,.4);
    animation:breathe 3.2s ease-in-out infinite; position:relative; z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .core::before{
    content:""; position:absolute; inset:-14px; border-radius:50%;
    border:2px solid rgba(0,229,255,.4); animation:breathe 3.2s ease-in-out infinite reverse;
  }
  body.state-listening .core{animation:breathe 1.4s ease-in-out infinite; background:radial-gradient(circle at 38% 32%, #fff6d8, var(--gold) 45%, #8f6400 80%); box-shadow:0 0 50px rgba(255,179,0,.6), inset 0 0 24px rgba(255,255,255,.4)}
  body.state-thinking .core{animation:breathe .7s ease-in-out infinite}
  body.state-speaking .core{animation:breathe .5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* equalizer bars */
  #bars{position:absolute; bottom:14px; display:flex; gap:4px; align-items:flex-end; height:34px; opacity:.85}
  #bars span{width:5px; background:linear-gradient(to top,var(--cyan),transparent); border-radius:3px; height:4px}
  body.state-speaking #bars span{background:linear-gradient(to top,#aaffaa,transparent)}

  #hint{flex:none; text-align:center; font-size:12px; letter-spacing:.15em; color:#6db9cc; padding:0 16px 8px}

  /* ---- chat log ---- */
  #log{flex:1; overflow-y:auto; padding:10px 16px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:85%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; animation:pop .25s ease}
  @keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1}}
  .msg.you{align-self:flex-end; background:rgba(0,229,255,.12); border:1px solid rgba(0,229,255,.3); border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start; background:rgba(255,179,0,.08); border:1px solid rgba(255,179,0,.3); border-bottom-left-radius:4px; color:#ffe9bd}
  .msg.sys{align-self:center; font-size:11px; letter-spacing:.15em; color:#4d8fa0; background:none; border:none}

  /* ---- input ---- */
  #typebar{flex:none; display:flex; gap:8px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid rgba(0,229,255,.15)}
  #typeInput{flex:1; background:rgba(0,229,255,.06); border:1px solid rgba(0,229,255,.3); color:#d8feff; padding:12px 14px; border-radius:24px; font-size:14px; outline:none}
  #typeInput:focus{border-color:var(--cyan); box-shadow:0 0 10px rgba(0,229,255,.25)}
  #sendBtn{background:var(--cyan); border:none; color:#00323c; font-weight:700; border-radius:24px; padding:0 18px; cursor:pointer}
  #micBtn{width:46px; border-radius:50%; border:1px solid rgba(0,229,255,.4); background:rgba(0,229,255,.08); color:var(--cyan); font-size:18px; cursor:pointer}
  #micBtn.on{background:var(--gold); color:#3c2a00; border-color:var(--gold)}

  /* ---- power / setup overlay ---- */
  #overlay{position:fixed; inset:0; background:rgba(3,7,10,.94); display:flex; align-items:center; justify-content:center; z-index:50; flex-direction:column; gap:18px; padding:24px; text-align:center}
  #overlay.hidden{display:none}
  #powerBtn{
    padding:16px 42px; font-size:15px; letter-spacing:.3em; font-weight:700; cursor:pointer;
    color:var(--cyan); background:transparent; border:1px solid var(--cyan); border-radius:40px;
    box-shadow:0 0 18px rgba(0,229,255,.3), inset 0 0 12px rgba(0,229,255,.15); transition:.2s;
  }
  #powerBtn:hover{background:rgba(0,229,255,.12); box-shadow:0 0 30px rgba(0,229,255,.5)}
  .setup{display:flex; flex-direction:column; gap:8px; width:100%; max-width:360px; text-align:left}
  .setup label{font-size:10px; letter-spacing:.2em; color:#5fa8ba}
  .setup input{background:rgba(0,229,255,.06); border:1px solid rgba(0,229,255,.3); color:#d8feff; padding:10px 12px; border-radius:10px; font-size:12px; outline:none; width:100%}
  #gear{background:none; border:none; color:#4d8fa0; cursor:pointer; font-size:16px; padding:4px 8px}
  #err{color:#ff8a80; font-size:12px; max-width:360px}
</style>
</head>
<body class="state-off">
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <span style="display:flex;align-items:center;gap:6px">
      <span id="status">OFFLINE</span>
      <button id="gear" title="Settings">⚙</button>
    </span>
  </header>

  <main>
    <div class="orb-zone">
      <div class="ring r3"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="core" id="core"></div>
      <div id="bars"></div>
    </div>
    <div id="hint">Say “Cortisol …” to wake me up</div>
    <div id="log"></div>
    <div id="typebar">
      <button id="micBtn" title="Push to talk">🎤</button>
      <input id="typeInput" placeholder="or type to JARVIS…" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </main>

  <div id="overlay">
    <h1 style="letter-spacing:.4em;color:var(--cyan);font-size:22px">J.A.R.V.I.S.</h1>
    <p style="font-size:12px;color:#6db9cc;max-width:320px">Voice-activated AI assistant. Needs microphone permission. Works best in Chrome.</p>
    <button id="powerBtn">⚡ INITIALIZE</button>
    <div class="setup" id="setupPanel" style="display:none">
      <label>GEMINI API KEY</label>
      <input id="keyInput" type="password">
      <label>WAKE WORD</label>
      <input id="wakeInput">
      <button id="saveBtn" style="margin-top:6px;background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:var(--cyan);padding:10px;border-radius:10px;cursor:pointer;letter-spacing:.2em;font-size:11px">SAVE & INITIALIZE</button>
    </div>
    <div id="err"></div>
  </div>

<script>
/* ================= CONFIG ================= */
const DEFAULT_KEY = "AQ.Ab8RN6JsCFFhKDNZnQ9GB5iYc_ENLdD9sImItXm35cWucm9Tfw";
const cfg = {
  key:  localStorage.getItem("jarvis_key")  || DEFAULT_KEY,
  wake: (localStorage.getItem("jarvis_wake") || "cortisol").toLowerCase(),
  model:"gemini-2.5-flash",
};
const SYSTEM_PROMPT =
  "You are JARVIS, a witty, loyal AI assistant inspired by Iron Man's JARVIS. " +
  "Address the user politely (call them 'Sir' sometimes). Keep answers SHORT and conversational " +
  "(max 2-3 sentences unless asked for detail) because your replies are spoken out loud. " +
  "No markdown, no emojis, no lists — plain spoken English.";

/* ================= STATE ================= */
let recog = null, state = "off", muted = false;
let cmdMode = false, pending = "", followMode = false;
let silenceTimer = null, history = [];
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const $ = id => document.getElementById(id);
const body = document.body, statusEl = $("status"), log = $("log");

/* ================= UI helpers ================= */
function setState(s){
  state = s;
  body.className = "state-" + s;
  statusEl.textContent = {off:"OFFLINE", idle:"LISTENING · say “"+cfg.wake+"”",
    listening:"LISTENING · your question…", thinking:"PROCESSING…", speaking:"SPEAKING"}[s] || s.toUpperCase();
  statusEl.classList.toggle("active", s==="listening" || s==="thinking");
  statusEl.classList.toggle("speaking", s==="speaking");
}
function addMsg(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
// equalizer bars
const barsEl = $("bars");
for (let i=0;i<24;i++){ const s=document.createElement("span"); barsEl.appendChild(s); }
setInterval(()=>{
  const active = state==="speaking" || state==="thinking";
  barsEl.querySelectorAll("span").forEach((b,i)=>{
    b.style.height = active ? (4 + Math.random()*(state==="speaking"?30:14)) + "px"
                            : (4 + Math.abs(Math.sin(Date.now()/700 + i))*6) + "px";
  });
}, 90);

/* ================= SPEECH IN ================= */
function startRecognition(){
  if (!SR){ showError("This browser doesn't support speech recognition. Use Chrome or Edge."); return; }
  recog = new SR();
  recog.continuous = true; recog.interimResults = true; recog.lang = "en-US";
  recog.onresult = e => {
    let fin = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t; else interim += t;
    }
    handleSpeech(fin.trim(), interim.trim());
  };
  recog.onerror = ev => { if (ev.error === "not-allowed") showError("Microphone blocked. Allow mic access in your browser settings."); };
  recog.onend   = () => { if (state !== "off" && !muted) setTimeout(() => { try{ recog.start(); }catch(e){} }, 250); };
  try{ recog.start(); }catch(e){}
  setState("idle");
  addMsg("Systems online. Say “" + cfg.wake + "” to talk to me, Sir.", "sys");
}

function handleSpeech(fin, interim){
  const heard = (fin + " " + interim).trim();
  if (!heard) return;

  /* --- waiting for wake word --- */
  if (state === "idle"){
    if (heard.toLowerCase().includes(cfg.wake)){
      pending = heard.toLowerCase().split(cfg.wake).slice(1).join(" ").trim();
      cmdMode = true; setState("listening");
      if (pending.length > 2){ scheduleSubmit(1400); }       // question came in same breath
      else scheduleListenWindow(6000);                        // just woke; wait for question
    }
    return;
  }
  /* --- capturing the question --- */
  if (cmdMode && (state === "listening")){
    pending += " " + fin;
    scheduleSubmit(1400);
    return;
  }
  /* --- quick follow-up window after an answer --- */
  if (followMode && fin){
    followMode = false; clearTimeout(silenceTimer);
    ask(fin);
  }
}
function scheduleSubmit(ms){
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(()=>{
    const q = pending.trim();
    pending = ""; cmdMode = false;
    if (q.length > 1) ask(q);
    else { setState("idle"); }
  }, ms);
}
function scheduleListenWindow(ms){
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(()=>{ pending=""; cmdMode=false; setState("idle"); }, ms);
}

/* ================= GEMINI ================= */
async function ask(question){
  if (!question) return;
  clearTimeout(silenceTimer); followMode = false;
  setState("thinking"); muted = true; try{ recog && recog.abort(); }catch(e){}
  addMsg(question, "you");
  const thinkingEl = addMsg("…", "ai");

  history.push({role:"user", text:question});
  const contents = history.slice(-12).map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{text: m.text}]
  }));

  try{
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${encodeURIComponent(cfg.key)}`,
      { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          systemInstruction:{parts:[{text:SYSTEM_PROMPT}]},
          contents,
          generationConfig:{temperature:0.8, maxOutputTokens:1024, thinkingConfig:{thinkingBudget:0}}
        })
      });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "Gemini API error");
    const answer = (data.candidates?.[0]?.content?.parts || []).map(p=>p.text||"").join("").trim();
    if (!answer) throw new Error("Empty response from Gemini");
    history.push({role:"model", text:answer});
    if (history.length > 24) history = history.slice(-24);
    speak(answer, thinkingEl);
  }catch(err){
    thinkingEl.textContent = "⚠ " + err.message;
    thinkingEl.style.color = "#ff8a80";
    setState("idle"); muted = false;
    setTimeout(()=>{ try{recog.start()}catch(e){} }, 300);
  }
}

/* ================= SPEECH OUT ================= */
function speak(text, el){
  setState("speaking");
  el.textContent = text;
  const u = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v=>/en[-_](GB|US)/i.test(v.lang) && /male|daniel|david|google uk english male/i.test(v.name))
         || voices.find(v=>/^en/i.test(v.lang));
  if (v) u.voice = v;
  u.rate = 1.02; u.pitch = 0.95;
  u.onend = () => {
    muted = false; setState("listening");
    // 6-second follow-up window: just speak again without the wake word
    followMode = true; scheduleListenWindow(6000);
    setTimeout(()=>{ try{recog && recog.start()}catch(e){} }, 300);
  };
  u.onerror = u.onend;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ================= TEXT INPUT ================= */
$("sendBtn").onclick = () => {
  const q = $("typeInput").value.trim();
  if (!q) return;
  $("typeInput").value = "";
  if (state === "off"){ begin(); setTimeout(()=>ask(q), 800); } else ask(q);
};
$("typeInput").addEventListener("keydown", e => { if (e.key === "Enter") $("sendBtn").click(); });

/* push-to-talk button: force command mode */
$("micBtn").onclick = () => {
  if (state === "off"){ begin(); return; }
  pending = ""; cmdMode = true; followMode = false;
  setState("listening"); scheduleListenWindow(8000);
  $("micBtn").classList.add("on");
  setTimeout(()=>$("micBtn").classList.remove("on"), 8000);
};

/* ================= POWER / SETTINGS ================= */
function showError(msg){ $("err").textContent = msg; }
function begin(){
  $("overlay").classList.add("hidden");
  localStorage.setItem("jarvis_started", "1");
  startRecognition();
}
$("powerBtn").onclick = () => {
  if (!cfg.key){ $("setupPanel").style.display = "flex"; showError(""); return; }
  begin();
};
$("gear").onclick = () => {
  $("overlay").classList.remove("hidden");
  $("powerBtn").style.display = "none";
  $("setupPanel").style.display = "flex";
  $("keyInput").value = cfg.key; $("wakeInput").value = cfg.wake;
};
$("saveBtn").onclick = () => {
  const k = $("keyInput").value.trim(), w = $("wakeInput").value.trim().toLowerCase();
  if (k) { cfg.key = k; localStorage.setItem("jarvis_key", k); }
  if (w) { cfg.wake = w; localStorage.setItem("jarvis_wake", w); }
  if (state === "off") begin();
  else { $("overlay").classList.add("hidden"); addMsg("Settings updated, Sir.", "sys"); setState("idle"); }
};
if (localStorage.getItem("jarvis_started") === "1"){
  $("powerBtn").textContent = "⚡ RESUME";
}
// preload voices
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

/* ================= PWA ================= */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
